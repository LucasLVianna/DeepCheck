services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: deepcheck_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - deepcheck

  db:
    image: mysql:8.0
    container_name: deepcheck_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "${DB_EXPOSED_PORT:-3306}:3306"
    volumes:
      - deepcheck_db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - deepcheck

networks:
  deepcheck:

volumes:
  deepcheck_db_data:
