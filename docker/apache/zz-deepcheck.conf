# Endurecimento do Apache para o DeepCheck.
# O prefixo "zz-" faz este arquivo carregar depois do security.conf do Debian,
# que também define ServerTokens/ServerSignature/TraceEnable.
# A raiz do projeto inteira é o DocumentRoot (bind mount em /var/www/html),
# então tudo que não deve ser servido pela web é bloqueado aqui.

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>

# Arquivos ocultos (.env, .git, .gitignore, .dockerignore...)
<LocationMatch "(^|/)\.">
    Require all denied
</LocationMatch>

# Configuração, scripts, infraestrutura e armazenamento interno
<LocationMatch "^/(config|scripts|docker|storage|src/Models)(/|$)">
    Require all denied
</LocationMatch>

# Documentação e arquivos de build
<FilesMatch "(?i)(\.(md|ya?ml|ini|log|sql|sh|py)|^Dockerfile)$">
    Require all denied
</FilesMatch>
