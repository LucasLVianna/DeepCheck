; Configuração de PHP do DeepCheck (carregada pelo Dockerfile).

; Fuso horário da aplicação (config/conexao.php replica este fuso na sessão do MySQL)
date.timezone = America/Sao_Paulo

; Não expor a versão do PHP nos headers
expose_php = Off

; Erros vão para o log do container (docker compose logs app), nunca para a resposta
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Sessão (também reforçado em config/auth.php)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; Formulários com tabelas dinâmicas (PGQ, checklist) enviam muitos campos; o padrão (1000)
; truncaria o POST silenciosamente.
max_input_vars = 5000
