; Configuração de PHP do DeepCheck (carregada pelo Dockerfile).

; Não expor a versão do PHP nos headers
expose_php = Off

; Erros vão para o log do container (docker compose logs app), nunca para a resposta
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; Sessão (também reforçado em config/auth.php)
session.use_strict_mode = 1
session.use_only_cookies = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
